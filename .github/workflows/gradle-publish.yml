name: Gradle Package

on:
  release:
    types: [created]
  workflow_dispatch:
    inputs:
      publish_openvsx:
        description: 'Publish to Open VSX (Ensure version in package.json is bumped!)'
        required: true
        type: boolean
        default: false
      publish_npm:
        description: 'Publish to npm registry as rostooling-mcp'
        required: true
        type: boolean
        default: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
      id-token: write # Required for Open VSX and npm Trusted Publishing (OIDC)

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          server-id: github
          settings-path: ${{ github.workspace }}

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@af1da67850ed9a4cedd57bfd976089dd991e2582 # v4.0.0

      - name: Build VS-Code extension (.vsix)
        run: ./gradlew vscodeExtension
        env:
          USERNAME: ${{ github.actor }}
          TOKEN: ${{ secrets.GPR_KEY }}

      # Always upload the built .vsix as an action artifact so you can inspect it in CI
      - name: Upload .vsix artifact
        uses: actions/upload-artifact@v4
        with:
          name: vsix-package
          path: rostooling-languages/build/vscode/*.vsix

      # Only attach to a GitHub Release when triggered by an actual release event
      - name: Upload .vsix to GitHub Release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: rostooling-languages/build/vscode/*.vsix

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      # Runs automatically on releases, or manually when the checkbox is selected
      - name: Publish to Open VSX
        if: github.event_name == 'release' || inputs.publish_openvsx
        run: npx ovsx@latest publish rostooling-languages/build/vscode/*.vsix --trusted-publishing

      - name: Publish to npm (rostooling-mcp)
        if: github.event_name == 'release' || inputs.publish_npm
        working-directory: rostooling-languages
        run: |
          npm pkg set name=rostooling-mcp
          npm publish --provenance --access public
          git checkout package.json
