task copyFatJar(type: Copy) {
    def shadowJarTask = rootProject.tasks.shadowJar
    dependsOn shadowJarTask
    from shadowJarTask.outputs
    into "server"
}

task copyStudioBackend(type: Copy) {
    into projectDir
    def studioDir = file("${rootProject.projectDir}/../ipa-rostooling-studio")
    if (!studioDir.exists()) {
        studioDir = file("${rootProject.projectDir}/ipa-rostooling-studio")
    }
    if (studioDir.exists()) {
        from("${studioDir}/scripts") {
            into "scripts"
            exclude "**/__pycache__/**"
            exclude "**/*.pyc"
        }
        from("${studioDir}/.agents/skills") {
            into "assets/skills"
        }
        from("${studioDir}/hooks") {
            into "assets/hooks"
        }
    }
}

clean {
    doLast {
        delete copyFatJar.outputs
        delete "${projectDir}/scripts"
        delete "${projectDir}/assets/skills"
        delete "${projectDir}/assets/hooks"
    }
}

npmInstall.dependsOn copyFatJar, copyStudioBackend
tasks.named('npm_test').configure {
    dependsOn copyFatJar, copyStudioBackend
}
tasks.named('vscodeExtension').configure {
    dependsOn copyFatJar, copyStudioBackend
}

task installExtension(type: Exec, dependsOn: vscodeExtension) {
    if (System.properties['os.name'].toLowerCase().contains('windows')) {
        commandLine 'code.cmd'
    } else {
        commandLine 'code'
    }
    args '--install-extension', vscodeExtension.destPath
    doLast {
        copyFatJar
    }
}

task startCode(type:Exec, dependsOn: installExtension) {
    if (System.properties['os.name'].toLowerCase().contains('windows')) {
        commandLine 'code.cmd'
    } else {
        commandLine 'code'
    }
    args "$rootProject.projectDir/demo/", '--new-window'
}

task publish(dependsOn: vscodeExtension, type: NodeTask) {
    script = file("$rootProject.projectDir/node_modules/vsce/out/vsce")
    args = [ 'publish', '-p', System.getenv('ACCESS_TOKEN'), "--packagePath", "${project.buildDir}/vscode/rostooling-languages-${project.version}.vsix"]
    execOverrides {
        workingDir = projectDir
    }
}